<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error {{ code }} &mdash; {{ app_name }}</title>
<script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-grid-bg"></div>
  <div class="auth-card" style="text-align:center;">
    <div class="auth-icon" style="background: linear-gradient(135deg, var(--danger), var(--critical));">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 style="font-size:34px; font-weight:800; color: var(--danger); margin: 6px 0 4px;">{{ code }}</h1>
    <p style="color: var(--text-muted); font-size:13px; margin-bottom:20px;">{{ message }}</p>
    <a href="/" class="btn-c btn-primary-c" style="justify-content:center;"><i class="fa-solid fa-house"></i> Go Home</a>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
