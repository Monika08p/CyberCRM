<div class="form-row-c">
  <div>
    <label class="form-label-c">Name *</label>
    <input type="text" name="name" class="form-control-c" required placeholder="Full name">
  </div>
  <div>
    <label class="form-label-c">Company</label>
    <input type="text" name="company" class="form-control-c" placeholder="Company name">
  </div>
</div>
<div class="form-row-c">
  <div>
    <label class="form-label-c">Email</label>
    <input type="email" name="email" class="form-control-c" placeholder="name@example.com">
  </div>
  <div>
    <label class="form-label-c">Phone</label>
    <input type="text" name="phone" class="form-control-c" placeholder="+1 555 000 0000">
  </div>
</div>
<div class="form-group-c">
  <label class="form-label-c">Address</label>
  <input type="text" name="address" class="form-control-c" placeholder="Street, city, country">
</div>
<div class="form-group-c">
  <label class="form-label-c">Notes</label>
  <textarea name="notes" class="form-control-c" rows="3" placeholder="Additional notes..."></textarea>
</div>
