<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &mdash; {{ app_name }}</title>
<script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-grid-bg"></div>
  <div class="auth-card">
    <button class="icon-btn" data-action="toggle-theme" style="position:absolute; top:16px; right:16px;" title="Toggle theme">
      <i class="fa-solid fa-sun" data-theme-icon></i>
    </button>

    <div class="auth-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <div class="auth-title">CyberCRM <span>Guardian</span></div>
    <div class="auth-subtitle">Smart Protection Against Insider Attacks</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash-c flash-{{ category }}">
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group-c">
        <label class="form-label-c"><i class="fa-solid fa-user"></i> Username</label>
        <input type="text" name="username" class="form-control-c" required autofocus placeholder="Enter your username">
      </div>
      <div class="form-group-c">
        <label class="form-label-c"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" name="password" class="form-control-c" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn-c btn-primary-c" style="width:100%; justify-content:center; padding:11px;">
        <i class="fa-solid fa-right-to-bracket"></i> Secure Login
      </button>
    </form>

    <div style="text-align:center; color: var(--text-faint); font-size:11px; margin-top:20px;">
      <i class="fa-solid fa-lock"></i> All access attempts are monitored &amp; logged.
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
